<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 3 · Lesson 2, part 2 · Team Talk</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F2A43;--cream:#FFF8EC;--coral:#E8553D;--teal:#12A594;--sun:#F5B700;--sky:#9FD8FF}
*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--cream);font-family:'Fredoka',system-ui,sans-serif;padding:16px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font-family:inherit;cursor:pointer}button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.top small{color:var(--sky);letter-spacing:2px}.top h1{margin:0;font-size:clamp(24px,4vw,34px)}
.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.nav span{color:var(--sky)}
.nav button{border:3px solid var(--sky);background:transparent;color:var(--cream);border-radius:999px;padding:6px 16px;font-size:17px;font-weight:600}
.nav button.on{background:var(--sun);border-color:var(--sun);color:var(--navy)}
.card{background:var(--cream);color:var(--navy);border-radius:26px;padding:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:14px;animation:pop .4s}
.card h2{margin:0;font-size:clamp(20px,3vw,28px)}.meta{display:flex;justify-content:space-between;font-weight:600;font-size:18px;flex-wrap:wrap}
.q{font-size:clamp(22px,3.4vw,32px);font-weight:700;line-height:1.35}.q b{color:var(--coral)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.o{display:flex;align-items:center;justify-content:center;gap:12px;border:3px solid var(--navy);background:#fff;color:var(--navy);border-radius:18px;padding:14px;font-size:clamp(18px,2.6vw,25px);font-weight:600}
.o.ok{background:#8FE3CF;animation:pop .4s}.o.bad{background:#FFB4A2;animation:shake .4s}.o:disabled{cursor:default}
.ic{background:#fff;border-radius:12px;flex:none}.fb{font-size:22px;font-weight:600;min-height:30px}
.go{align-self:flex-end;background:var(--navy);color:var(--cream);border:0;border-radius:999px;padding:12px 32px;font-size:21px;font-weight:700}
.go.alt{background:var(--coral);color:var(--navy)}.go[disabled]{opacity:.35}
.row{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.big{display:flex;justify-content:center}
.box{background:#fff;border:2px solid var(--navy);border-radius:12px;padding:12px 20px;font-size:clamp(18px,2.4vw,22px);line-height:1.8}.box b{color:var(--coral)}
.learn{background:var(--sky);border-radius:16px;padding:10px 18px;font-size:19px}
.mt{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}@media(max-width:700px){.mt{grid-template-columns:1fr}}
.s{display:block;width:100%;text-align:left;border:3px solid var(--navy);background:#fff;color:var(--navy);border-radius:14px;padding:10px 14px;font-size:clamp(17px,2.2vw,21px);margin-bottom:8px}
.s.sel{background:var(--sun)}.s.done{background:#8FE3CF}.s b{color:var(--coral)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.t{border:3px solid var(--navy);background:#fff;border-radius:16px;padding:8px;color:var(--navy);font-weight:700;font-size:20px}
.t.done{opacity:.35}.t.shake{animation:shake .4s;background:#FFB4A2}
.cz{display:grid;grid-template-columns:40px repeat(3,1fr);gap:8px;align-items:center}.cz .o{padding:6px 10px;justify-content:flex-start;border-color:transparent;font-size:clamp(17px,2.2vw,22px)}.cz .o.sel{border-color:var(--navy)}
.dot{width:26px;height:16px;border:3px solid var(--navy);border-radius:50%;background:#fff;flex:none}.sel .dot{background:var(--navy)}
.credit{text-align:right;font-size:15px}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.tl{border:3px solid var(--navy);border-radius:18px;padding:10px 6px;color:var(--navy);font-size:22px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}.tl.seen{background:var(--navy);color:var(--cream)}.say{background:var(--navy);color:var(--cream);border-radius:18px;padding:12px 20px;font-size:23px;min-height:30px}.pings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.pg{border:0;border-radius:18px;padding:16px;font-size:22px;font-weight:700;color:var(--navy)}.ex{border:0;border-radius:20px;padding:22px 14px;font-size:clamp(22px,3vw,30px);font-weight:700;color:var(--navy);display:flex;flex-direction:column;gap:6px;align-items:center}.ex small{font-size:17px;font-weight:400}.ex.seen{outline:5px solid var(--teal)}.dl{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto;padding-right:6px}.ln{display:block;text-align:left;border:0;border-radius:16px;padding:8px 14px;font-size:clamp(16px,2.1vw,20px);color:var(--navy);max-width:85%}.ln b{display:block;font-size:14px;opacity:.75}.ln.F{background:#9FD8FF;align-self:flex-start}.ln.M{background:#FFB4A2;align-self:flex-end}.ln.hl{outline:4px solid var(--sun)}</style></head><body>

<symbol id="i-passport" viewBox="0 0 64 64"><rect x="16" y="8" width="32" height="48" rx="4" fill="#12457A"/><circle cx="32" cy="27" r="9" fill="none" stroke="#F5B700" stroke-width="2.5"/><path d="M23 27h18M32 18v18" stroke="#F5B700" stroke-width="2"/><rect x="22" y="43" width="20" height="4" rx="2" fill="#F5B700"/></symbol>
<symbol id="i-guidebook" viewBox="0 0 64 64"><rect x="12" y="10" width="40" height="44" rx="4" fill="#12A594"/><rect x="18" y="16" width="28" height="22" rx="2" fill="#FFF8EC"/><path d="M32 34c-6-7-6-12 0-12s6 5 0 12z" fill="#E8553D"/><rect x="18" y="43" width="22" height="3" fill="#FFF8EC"/></symbol>

<symbol id="i-medicine" viewBox="0 0 64 64"><rect x="18" y="22" width="28" height="34" rx="6" fill="#12A594"/><rect x="22" y="12" width="20" height="10" rx="3" fill="#0F2A43"/><rect x="22" y="32" width="20" height="14" rx="2" fill="#FFF8EC"/><path d="M32 34v10M27 39h10" stroke="#E8553D" stroke-width="3"/></symbol>

<div class="wrap">
<div class="top"><div><small>UNIT 3 · TRAVEL · LESSON 2, PART 2</small><h1>Team Talk: Practice</h1></div><div style="text-align:right"><b id="stars"></b><br><small style="letter-spacing:0">Lesson time: 25 minutes</small></div></div>

<script>
const SY=['suitcase','passport','guidebook','flip-flops','raincoat','toothbrush','washbag','charger','soap','pillow','umbrella','medicine'];
const ic=(k,s=56)=>'<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-'+k+'"/></svg>';
const N=a=>a.map(t=>({t,p:SY.includes(t)?t:null}));
const TF=(pr,a,ex)=>({pr,o:N(['True','False']),a:a?0:1,ex});
const A=[
{n:'1 · Three facts and a fib',min:3,type:'mc',q:[
{pr:'Two facts are true and one is a fib. Find the fib!',o:N(['Frank is going to take a small rucksack.','Majid is going to take a small bag.','Majid has a big umbrella.']),a:2,ex:'Majid says: “I don’t have one.”'},
{pr:'Two facts are true and one is a fib. Find the fib!',o:N(['Frank will bring toothpaste, soap and shampoo.','They are going to travel by plane.','Frank is going to buy a guidebook at a bookshop.']),a:2,ex:'Frank will download a guidebook.'},
{pr:'Two facts are true and one is a fib. Find the fib!',o:N(['They are going to visit London.','Majid is not excited about the trip.','Majid will go home and look for his passport.']),a:1,ex:'Majid says: “Yes!” He is excited.'}]},
{n:'2 · Complete the sentences',min:5,type:'mc',q:[
{pr:'Frank asks Majid if he’s ___ for their trip to London.',o:N(['tired','ready','late']),a:1},
{pr:'Majid says he’s going to take a small ___.',o:N(['rucksack','suitcase','bag']),a:2},
{pr:'Frank is going to put his raincoat into his ___.',o:N(['washbag','suitcase','bag']),a:1},
{pr:'Majid tells Frank that he doesn’t have an ___.',o:N(['passport','raincoat','umbrella']),a:2},
{pr:'Frank says they can share his ___, soap and shampoo.',o:N(['toothbrush','guidebook','toothpaste']),a:2},
{pr:'Majid is going to look for his ___ at home.',o:N(['charger','pillow','passport']),a:2}]},
{n:'3 · True or false',min:4,type:'mc',q:[TF('Frank isn’t going to take a camera on the trip.',0,'He’s going to take a rucksack with his camera in it.'),TF('Majid is going to take sweatshirts and jeans.',1,'Majid is taking the same clothes as Frank.'),TF('Frank doesn’t think they will need an umbrella.',0,'He says he will take one.'),TF('Majid tells Frank that he should bring his passport.',0,'Frank tells Majid that he should bring his passport.'),TF('Majid knows they are going to visit London.',1,'Majid knows where they are going.'),TF('Frank is going to buy a guidebook at a bookshop.',0,'Frank is going to download a guidebook.')]},
{n:'4 · Complete the dialogues',min:5,type:'mc',q:[
{pr:'A: “Can you give me some advice about my holiday next week?”<br>B: “___ I’m always happy to help.”',o:N(['Good plan!','Of course!','Thanks for your help.']),a:1},
{pr:'A: “I’m going to take a raincoat. Do you think that’s a good idea?”<br>B: “___ You don’t know what the weather is like at this time of year.”',o:N(['Good plan!','Of course!','Thanks for your help.']),a:0},
{pr:'B: “Take a jumper, too.”<br>A: “That’s good advice! ___”<br>B: “Oh, it’s no problem!”',o:N(['Of course!','Good plan!','Thanks for your help.']),a:2},
{pr:'A: “We’ve done it! The house is finally tidy!”<br>B: “Yes, it is. ___”<br>A: “You’re welcome.”',o:N(['Thanks for your help.','Good plan!','Of course!']),a:0},
{pr:'B: “I’m hungry. Can you help me make some pizza?”<br>A: “___ Pizza’s my favourite food!”',o:N(['Thanks for your help.','Of course!','Good plan!']),a:1},
{pr:'B: “Great. Then after lunch we could go to the 3D cinema.”<br>A: “___ There’s a new science fiction film that I really want to watch.”',o:N(['Good plan!','Of course!','Thanks for your help.']),a:0}]},
{n:'5 · Pass the ball',min:3,type:'mc',q:[
{p:'suitcase',w:'suitcase',pr:'Catch the ball! What is it?',o:N(['pillow','soap','suitcase']).map(o=>({t:o.t})),a:2},
{p:'umbrella',w:'umbrella',pr:'Catch the ball! What is it?',o:N(['umbrella','raincoat','passport']).map(o=>({t:o.t})),a:0},
{p:'charger',w:'charger',pr:'Catch the ball! What is it?',o:N(['washbag','charger','guidebook']).map(o=>({t:o.t})),a:1},
{p:'flip-flops',w:'flip-flops',pr:'Catch the ball! What is it?',o:N(['toothbrush','suitcase','flip-flops']).map(o=>({t:o.t})),a:2},
{p:'washbag',w:'washbag',pr:'Catch the ball! What is it?',o:N(['washbag','pillow','umbrella']).map(o=>({t:o.t})),a:0},
{p:'medicine',w:'medicine',pr:'Catch the ball! What is it?',o:N(['soap','medicine','charger']).map(o=>({t:o.t})),a:1}]},
{n:'6 · Final task',min:5,type:'cloze'}];
const C={t:'Boy 1 asks for some {0} (1) about his holiday. He is going to take a {1} (2). Boy 2 says, “{2} You don’t know the weather.” (3) Boy 2 also says Boy 1 should take a {3} (4). Boy 1 says, “That’s good advice! {4}” (5)',o:[['advice','passport','pizza'],['pillow','raincoat','guidebook'],['Of course!','Good plan!','You’re welcome.'],['jumper','toothbrush','charger'],['Of course!','Good plan!','Thanks for your help.']],a:[0,1,1,0,2]};
let S={step:0,st:A.map(()=>({i:0,pk:null,sc:0,done:false,ans:{},chk:false}))};
let ac;function tone(f,d,ty){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();f.forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=hz;const t=ac.currentTime+i*d;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)})}catch(e){}}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const GOOD=()=>tone([523,659,784],.12,'triangle'),BAD=()=>tone([220,160],.2,'sawtooth');
function go(k){tone([523,659],.1);S.step=k;render()}
function lis(){say(A[S.step].q[S.st[S.step].i].w)}
function pick(i){const s=S.st[S.step],q=A[S.step].q[s.i];if(s.pk!==null)return;s.pk=i;if(i===q.a){s.sc++;GOOD()}else BAD();say(q.w||q.o[q.a].t.replace(/\.$/,''));render()}
function nxt(){const s=S.st[S.step],a=A[S.step];if(s.pk===null)return;if(s.i+1<a.q.length){s.i++;s.pk=null}else{s.done=true;tone([523,659,784,1047],.14,'triangle')}render()}
function retry(){S.st[S.step]={i:0,pk:null,sc:0,done:false,ans:{},chk:false};tone([440,523],.1);render()}
function cl(g,i){const s=S.st[5];if(s.chk)return;s.ans[g]=i;tone([660],.08);render()}
function chk(){const s=S.st[5];if(Object.keys(s.ans).length<5){tone([220],.15,'square');return}s.chk=true;const n=C.a.filter((a,g)=>s.ans[g]===a).length;tone(n>=4?[523,659,784,1047]:[392,330,262],.14,'triangle');render()}
function stars(){const s=S.st;return s.slice(0,5).reduce((x,y)=>x+y.sc,0)+(s[5].chk?C.a.filter((a,g)=>s[5].ans[g]===a).length:0)}
function mc(a,s){
 const q=a.q[s.i],n=a.q.length,lk=s.pk!==null,ok=lk&&s.pk===q.a;
 if(s.done)return '<div class="card"><h2>'+a.n+'</h2><div class="q" style="text-align:center;font-size:56px;color:#E8553D">'+s.sc+' / '+n+'</div><div class="fb" style="text-align:center">'+(s.sc===n?'Excellent! Fantastic work!':s.sc>=n-1?'Well done!':'Good try! Play again.')+'</div><div class="row"><button class="go alt" onclick="retry()">Play again</button>'+(S.step<5?'<button class="go" onclick="go('+(S.step+1)+')">Next part →</button>':'')+'</div></div>';
 const pic=q.p?'<div class="big">'+ic(q.p,120)+'</div><div class="row" style="justify-content:center"><button class="go alt" onclick="lis()">Listen</button></div>':'';
 const pr=q.pr.replace('___',lk?'<b>'+q.o[q.a].t+'</b>':'______');
 return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>Question '+(s.i+1)+' / '+n+' · Stars: '+s.sc+'</span></div>'+pic+'<div class="q">'+pr+'</div><div class="grid">'+q.o.map((o,i)=>'<button class="o'+(lk&&i===q.a?' ok':lk&&i===s.pk?' bad':'')+'" '+(lk?'disabled':'')+' onclick="pick('+i+')">'+(o.p?ic(o.p,40):'')+'<span>'+o.t+'</span></button>').join('')+'</div><div class="fb">'+(lk?(ok?'Great job! ':'Not quite. ')+'The answer is: '+q.o[q.a].t+'. '+(q.ex||''):'Choose the correct answer.')+'</div><button class="go" onclick="nxt()" '+(lk?'':'disabled')+'>'+(s.i+1===n?'Finish':'Next →')+'</button></div>'}
function view(){
 const a=A[S.step],s=S.st[S.step];
 if(a.type==='mc')return mc(a,s);
 const g=i=>'<b>'+(s.ans[i]===undefined?'______':C.o[i][s.ans[i]])+'</b>',n=C.a.filter((x,i)=>s.ans[i]===x).length;
 return '<div class="card"><div class="meta"><span>Finishing the lesson · Grammar / Vocabulary</span><b>(5 marks)</b></div><div style="font-style:italic;font-size:18px">For each item, shade in the bubble next to the correct option.</div><div class="box">'+C.t.replace(/\{(\d)\}/g,(m,i)=>g(+i))+'</div>'+C.o.map((os,gi)=>'<div class="cz"><b>'+(gi+1)+')</b>'+os.map((w,i)=>{const sel=s.ans[gi]===i,cls=s.chk&&i===C.a[gi]?' ok':s.chk&&sel?' bad':'';return '<button class="o'+(sel?' sel':'')+cls+'" onclick="cl('+gi+','+i+')"><span class="dot"></span>'+w+'</button>'}).join('')+'</div>').join('')+'<div class="row"><b style="font-size:26px;color:#E8553D;margin-right:auto">'+(s.chk?'Score: '+n+' / 5':'')+'</b><span>'+(s.chk?(n===5?'Excellent!':'Review: '+C.a.map((x,i)=>s.ans[i]!==x?C.o[i][x]:null).filter(Boolean).join(', ')):'Answer all 5 items, then press Check.')+'</span><button class="go alt" onclick="chk()">Check</button><button class="go" onclick="retry()">Try again</button></div><div class="credit">Created by T.Badria Alfalahi</div></div>'}
function render(){document.getElementById('nav').innerHTML='<span>Start with any part:</span>'+A.map((a,k)=>'<button class="'+(k===S.step?'on':'')+'" onclick="go('+k+')">'+a.n+'</button>').join('');document.getElementById('stars').textContent='Stars: '+stars();document.getElementById('main').innerHTML=view()}
render();
</script></body></html>
